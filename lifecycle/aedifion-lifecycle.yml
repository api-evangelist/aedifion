  announced_deprecations:
  - item: HTTP Basic authentication
    status: legacy, deprecation signalled
    statement: >-
      "The aedifion HTTP API supports Basic Auth for legacy reasons until further notice.
      HTTP Basic Auth may be deprecated in future."
    source: https://docs.aedifion.io/en/developers/http-api/guides-and-tutorials/authentication/
    replacement: OpenID Connect bearer tokens
    sunset_date: not stated
  - item: MQTT metadata scheme V1
    status: deprecated
    statement: Metadata messages support two schemes; V1 is deprecated and V2 is current.
    source: https://docs.aedifion.io/en/developers/mqtt-api/
    replacement: metadata scheme V2 (entity/mode/tags structure)
    sunset_date: not stated
  - item: Schedule deployment by direct datapoint write
    status: breaking change, already landed
    statement: >-
      Changelog 2.1.13 (11.08.2026) - schedules now deploy via the Schedule .controls app
      instead of writing to datapoints; the tutorial was updated with new endpoints.
    source: https://docs.aedifion.io/en/changelog/
