apis:
- name: aedifion HTTP API
  description: >-
    Versioned REST API (v2) for the aedifion.io building operations platform. Covers
    company, realm, project and user administration; datapoint and timeseries read/write;
    virtual datapoints; the semantic component/pin data model; analytics runs and results;
    cloud-based controls apps, setpoints and schedules; alerts and tasks; a document
    database; and an AI assistant. 208 operations across 147 paths, every one carrying an
    operationId, summary, description and tag. Authentication is HTTP Basic (legacy) or
    OpenID Connect bearer tokens issued by the aedifion Keycloak realm.
  humanURL: https://docs.aedifion.io/en/developers/http-api/
  image: https://cdn.prod.website-files.com/6942a43e5bcce46ebe9f73a1/6942a43e5bcce46ebe9f7529_65f998eafa61f2995943d60d_favicon-32x32.png
