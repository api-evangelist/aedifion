aid: aedifion
name: Aedifion
description: aedifion GmbH is a Cologne-based PropTech founded in 2017 that operates a vendor-neutral,
  patented cloud platform for the optimized operation of non-residential buildings. The platform ingests
  real-time operating data from all building trades via plug-and-play edge devices, applies analytics
  and AI to detect faults and inefficiencies, and autonomously controls HVAC and building services based
  on weather forecasts, occupancy and electricity prices - cutting energy use, CO2 emissions and operating
  costs by up to 40% without structural retrofits. Products span aedifion.io (connectivity and monitoring),
  aedifion.analytics, aedifion.controls, aedifion.dynamics (demand-side management) and aedifion.smartkit.
  Developers get a documented HTTP API (OpenAPI 3.0, 208 operations across projects, datapoints, timeseries,
  analytics, controls, alerts and tasks), an MQTT broker and a Kafka interface for streaming building
  telemetry. The company serves owners, operators and asset managers of commercial real estate and supports
  decarbonization, ESG reporting and DGNB, ISO 50001 and GEG certification.
