- name: aedifion MQTT API
  description: >-
    MQTT 3.1.1 broker interface at mqtt.aedifion.io for streaming building telemetry into
    and out of the aedifion.io platform. TLS-only (ports 8883 for native MQTT, 9001 for
    MQTT over WebSockets), username/password authentication with per-topic read/write
    authorization. Three topic families - timeseries, META and CONTROLS - are namespaced by
    load-balancing group and project handle. Timeseries payloads use InfluxDB Line
    Protocol; metadata and controls payloads are JSON.
  humanURL: https://docs.aedifion.io/en/developers/mqtt-api/
  image: https://cdn.prod.website-files.com/6942a43e5bcce46ebe9f73a1/6942a43e5bcce46ebe9f7529_65f998eafa61f2995943d60d_favicon-32x32.png
