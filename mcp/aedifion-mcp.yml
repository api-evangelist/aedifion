  description: >-
    Write a setpoint to a datapoint in a live building. HIGH CONSEQUENCE - this actuates
    physical HVAC equipment.
  source_operation: openapi/aedifion-openapi.yml#post_datapoint_setpoint
  read_only: false
  consequence: physical
  safeguards:
    dry_run: The operation accepts dryrun=true, documented as "Do a dry run without actually
      writing anything." An agent should always rehearse first.
    reversal: Re-issue with value='null' to reset the point back to local building automation
      control.
    acknowledgement: Pass acked=true and redeem the returned reference at
      get_datapoint_setpoint to learn whether the building network applied it - the 200 alone
      does not mean the write landed.
    human_in_the_loop: recommended
design_notes:
- >-
  Any real MCP server for aedifion should expose the 79 GET operations freely and gate the
  write surface. The single operation that needs the most care is post_datapoint_setpoint: it
  is best-effort, non-acked and stateless by aedifion's own description, and it moves physical
  plant.
- >-
  The 43 DELETE operations have no undo anywhere in the API and should not be exposed as tools
  without explicit human confirmation.
- >-
  Datapoint identifiers are protocol-shaped strings such as "bacnet100-4120-CO2". An agent
  should resolve points through the tag and component surface, not by guessing identifiers.
