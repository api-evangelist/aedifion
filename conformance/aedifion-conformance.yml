domain_standards:
- id: project-haystack
  conforms: true
  evidence_class: documentation
  evidence: >-
    The semantic data model documentation states aedifion uses Project Haystack's predefined
    markers and tags to map entities to its semantic data model, while noting structural
    differences between Haystack's flexible tagging and aedifion's predefined component model.
    https://docs.aedifion.io/en/products/io/data/semantic-data-model/
  note: >-
    This is the load-bearing domain standard for building data. It is asserted in the docs and
    reflected in the API's first-class tag surface (datapoint tags, tag associations with a
    confirmed/unconfirmed state), but no Haystack marker vocabulary or version is declared in
    the OpenAPI itself, so a consumer cannot verify the alignment from the contract alone.
- id: bacnet
  conforms: true
  evidence_class: contract
  evidence: >-
    The Node units schema in the OpenAPI carries a BACnet alias alongside pint and
    units-conversion aliases - e.g. {"bacnet":"degreesCelsius","pint":"degrees-celsius",
    "units-conversion":"deg-C"} - so engineering units are mapped to BACnet unit enumerations
    in the contract. Datapoint identifiers are BACnet-shaped, with the spec's own example being
    "bacnet100-4120-CO2". The edge device documents BACnet logger, publisher, subscriber and
    writer roles.
  source: openapi/_original/aedifion-openapi.json#/components/schemas/Node
- id: influxdb-line-protocol
  conforms: true
  evidence_class: contract
  evidence: >-
    The timeseries import operation declares format as an enum of ["csv",
    "influx_line_protocol"] with a time_precision parameter documented as used only for
    influx_line_protocol. The same wire format is mandatory for MQTT timeseries payloads and
    is the Kafka message format.
  source: openapi/_original/aedifion-openapi.json
