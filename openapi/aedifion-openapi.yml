components:
  parameters:
    LanguageQueryParam:
      description: |
        Choose language in which the response should be displayed.
        - 'en' for English
        - 'de' for German
        - 'fr' for French
      in: query
      name: language
      schema:
        enum:
        - en
        - de
        - fr
        type: string
  schemas:
    AIConversationThread:
      properties:
        summary:
          description: Summary of the first prompt.
          type: string
        thread_id:
          description: Unique id of conversation thread.
          type: string
        updated_at:
          description: The last updated date of the conversation thread.
          format: date-time
          type: string
      type: object
    AIConversationThreads:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AIConversationThread'
          type: array
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      type: object
    Activity:
      properties:
        action:
          type: string
        message:
          type: string
        return_code:
          format: int32
          type: integer
        time:
          format: date-time
          type: string
      required:
      - time
      - return_code
      - action
      - message
      type: object
    Alert:
      properties:
        alarm_dashboard:
          type: boolean
        alert_type:
          type: string
        attributes:
          type: string
        created:
          format: date-time
          type: string
        dataPointID:
          type: string
        delay:
          description: |
            Debounce duration the condition must hold before the alarm fires (e.g.
            '5m'). Only present for threshold and discrete alerts with a delay configured.
          type: string
        description:
          type: string
        email:
          format: email
          type: string
        id:
          format: int64
          type: integer
        level:
          description: The severity a discrete alert fires at. Only set for discrete
            alerts.
          type: string
        name:
          type: string
        negate:
          description: |
            Whether a discrete alert fires while the value is NOT one of its
            values. Only set for discrete alerts.
          type: boolean
        period:
          description: Throughput measurement period as a duration string (e.g. '2h').
            Only set for throughput alerts.
          type: string
        project_id:
          format: int64
          type: integer
        repeat:
          description: |
            Re-notification interval as a duration string (e.g.
            '2h'), or 'never' (notify only on level changes).
          type: string
        status:
          type: string
        teams_webhook:
          description: Comma-separated MS Teams webhook URLs configured for this alert.
          type: string
        telegram_chatid:
          type: string
        threshold_crit:
          type: number
        threshold_crit_reset:
          type: number
        threshold_dead:
          type: number
        threshold_info:
          type: number
        threshold_info_reset:
          type: number
        threshold_ok:
          type: number
        threshold_order:
          enum:
          - asc
          - desc
          type: string
        threshold_warn:
          type: number
        threshold_warn_reset:
          type: number
        timezone:
          description: IANA timezone used to render this alert's notification timestamps.
          type: string
        updated:
          format: date-time
          type: string
        values:
          description: The discrete values the alert fires on. Only set for discrete
            alerts.
          items:
            type: number
          type: array
      required:
      - id
      - name
      - description
      - project_id
      - created
      - alert_type
      - status
      type: object
    AlertNotification:
      additionalProperties: false
      description: Notification channels for an alert. Each channel is optional.
      properties:
        dashboard:
          $ref: '#/components/schemas/DashboardNotificationPoint'
          nullable: true
        email:
          $ref: '#/components/schemas/EmailNotificationPoint'
          nullable: true
        ms_teams:
          $ref: '#/components/schemas/MSTeamsNotificationPoint'
          nullable: true
        telegram:
          $ref: '#/components/schemas/TelegramNotificationPoint'
          nullable: true
      type: object
    AlertThresholds:
      additionalProperties: false
      description: |
        Trigger and reset thresholds per severity. At least one of 'info', 'warn', or 'crit' must
        be provided; omitted levels are not evaluated. The 'order' (ascending/descending) is
        inferred from the values when two or more levels are given (and validated if also supplied),
        and is REQUIRED when only a single level is configured, since one value cannot determine the
        direction. 'asc' fires when the value rises to/above a level; 'desc' fires when it falls
        to/below. Reset values default to their trigger value when omitted.
      properties:
        crit:
          nullable: true
          type: number
        crit_reset:
          nullable: true
          type: number
        info:
          nullable: true
          type: number
        info_reset:
          nullable: true
          type: number
        order:
          description: |
            Alarm direction. Optional when >=2 levels are configured (inferred from the values);
            required when exactly one level is configured.
          enum:
          - asc
          - desc
          type: string
        warn:
          nullable: true
          type: number
        warn_reset:
          nullable: true
          type: number
      type: object
    AnalysisFunction:
      properties:
        alphanumeric_id:
          type: string
        attributes:
          items:
            $ref: '#/components/schemas/ComponentAttributeDefinition'
          type: array
        execution_schedule:
          type: string
        id:
          format: int64
          type: integer
        kpis:
          items:
            type: string
          type: array
        name:
          type: string
        nameDE:
          deprecated: true
          description: 'Deprecated: use the localized ''name'' field instead.'
          type: string
        nameEN:
          deprecated: true
          description: 'Deprecated: use the localized ''name'' field instead.'
          type: string
        pins:
          items:
            $ref: '#/components/schemas/Pin'
          type: array
      required:
      - id
      - alphanumeric_id
      - nameEN
      - nameDE
      - kpis
      type: object
    AnalysisFunctionShort:
      properties:
        alphanumeric_id:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
      - id
      - alphanumeric_id
      - name
      type: object
    AnalysisResult:
      properties:
        alphanumeric_id:
          type: string
        analytics_version:
          type: string
        display_name:
          type: string
        end:
          format: date-time
          type: string
        function_name:
          type: string
        info:
          items:
            type: string
          type: array
        instance_id:
          type: integer
        interpretation:
          type: string
        kpi:
          items:
            $ref: '#/components/schemas/KPIResult'
          type: array
        plots:
          items:
            $ref: '#/components/schemas/PlotsResult'
          type: array
        project_id:
          type: integer
        recommendation:
          items:
            type: string
          type: array
        signal_color:
          enum:
          - green
          - yellow
          - red
          type: string
        start:
          format: date-time
          type: string
        status:
          type: string
        summary_kpi:
          $ref: '#/components/schemas/SummaryKPIResult'
        timeseries:
          items:
            $ref: '#/components/schemas/TimeseriesResult'
          type: array
      type: object
    AnalysisResultReferences:
      properties:
        result_ids:
          description: List of created result reference IDs.
          items:
            format: uuid
            type: string
          type: array
      type: object
    AnalysisResultShort:
      properties:
        function_id:
          type: integer
        id:
          type: string
        instance_id:
          type: integer
        interpretation:
          type: string
        signal_color:
          enum:
          - green
          - grey
          - yellow
          - red
          type: string
      required:
      - id
      - instance_id
      - function_id
      type: object
    AnalysisResultStatistics:
      properties:
        count:
          description: Number of analysis results with this signal color.
          type: integer
        signal_color:
          description: The signal color of the analysis results.
          type: string
      type: object
    AnalysisResultSummary:
      properties:
        input_parameters:
          type: object
        interpretation:
          type: string
        result_id:
          type: string
        savings_potential_kpis:
          items:
