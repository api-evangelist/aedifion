          Available options:
           - "max"
           - "mean"
           - "median"
           - "min"
           - "mode"
           - "sum"
        in: query
        name: project_aggregation
        required: false
        schema:
          default: mean
          enum:
          - max
          - mean
          - median
          - min
          - mode
          - sum
          type: string
