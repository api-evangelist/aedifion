idempotency:
  coverage: partial
  mechanism: none
  idempotency_key_header: false
  scope:
  - post_project_in_project_group
  - delete_project_in_project_group
  detail: >-
    There is NO Idempotency-Key header and no request-replay protection anywhere on the API.
    Exactly two operations are explicitly documented as idempotent, and both are set-membership
    operations that are naturally so - the spec says "assigning an already-assigned project
    succeeds without creating a duplicate" and "unassigning a project that is not in the group
    succeeds without error". All 43 DELETE operations are idempotent by HTTP semantics, and all
    24 PUT operations are replacements rather than increments, so a repeated call is usually
    safe - but that is a property of the verb, not a guarantee the provider states.
    The genuinely dangerous case is POST: a retried report generation or digital-twin import
    is caught by a 409 Conflict rather than an idempotency key, and a retried
    post_datapoint_setpoint will write to physical building equipment a second time.
  agent_guidance: >-
    An agent must treat POST on this API as at-most-once. Use the 409 responses as the
    de-duplication signal on long-running jobs, and use dryrun plus the setpoint
    acknowledgement reference to confirm a write landed before considering a retry.
