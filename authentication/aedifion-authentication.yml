  - client_secret_basic
  - client_secret_post
  - tls_client_auth
  - client_secret_jwt
  sources: [openapi/aedifion-openapi.yml, well-known/aedifion-openid-configuration.json]
- name: mqtt-credentials
  type: other
  transport: mqtt
  note: >-
    The MQTT broker at mqtt.aedifion.io authenticates with username/password in the MQTT
    CONNECT packet over TLS. Limited-validity credentials are minted through the HTTP API's
    MQTT user-management endpoints; unlimited-validity credentials are issued only on
    request by aedifion staff. Authorization is per-topic read/write.
  docs: https://docs.aedifion.io/en/developers/http-api/guides-and-tutorials/mqtt-user-management/
- name: kafka-sasl
  type: other
  transport: kafka
  mechanism: SASL/SCRAM-SHA-512 over SSL
  note: Kafka consumers authenticate with SASL_SCRAM_SHA512 and security_protocol SSL.
  docs: https://docs.aedifion.io/en/developers/kafka/
sso:
