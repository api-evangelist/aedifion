note: >-
  The OpenAPI declares a single openIDConnect scheme exposing only the mandatory `openid`
  scope. The authoritative scope list is the one advertised by the aedifion Keycloak realm's
  own OIDC discovery document, fetched live and saved to
  well-known/aedifion-openid-configuration.json. These are Keycloak's standard realm scopes
  plus an `api` scope; aedifion publishes no per-resource scope reference page, and
  fine-grained authorization on the HTTP API is enforced by role-based access control on
  projects and datapoints rather than by OAuth scopes.
